name: Publish standalone executables

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-standalone-exes.yml'

permissions:
  contents: write
  statuses: write

jobs:
  publish:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build x86
        shell: pwsh
        run: |
          cmake -S modern -B build-x86 -A Win32
          cmake --build build-x86 --config Release --parallel
          & '.\build-x86\Release\RemoteSupport.exe' --self-test

      - name: Build x64
        shell: pwsh
        run: |
          cmake -S modern -B build-x64 -A x64
          cmake --build build-x64 --config Release --parallel
          & '.\build-x64\Release\RemoteSupport.exe' --self-test

      - name: Upload and verify release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item '.\build-x86\Release\RemoteSupport.exe' '.\Windows-Remote-Support-x86.exe'
          Copy-Item '.\build-x64\Release\RemoteSupport.exe' '.\Windows-Remote-Support-x64.exe'

          gh release upload v0.1.0 `
            '.\Windows-Remote-Support-x86.exe' `
            '.\Windows-Remote-Support-x64.exe' `
            --clobber `
            --repo '${{ github.repository }}'

          $assets = gh release view v0.1.0 --repo '${{ github.repository }}' --json assets --jq '.assets[].name'
          $ok = ($assets -contains 'Windows-Remote-Support-x86.exe') -and ($assets -contains 'Windows-Remote-Support-x64.exe')
          $state = if ($ok) { 'success' } else { 'failure' }
          $description = if ($ok) { 'Standalone x86/x64 EXEs published to v0.1.0' } else { 'Standalone EXEs missing from v0.1.0' }

          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -f state="$state" `
            -f context='standalone-exe-release' `
            -f description="$description" | Out-Null

          if (-not $ok) { throw 'Standalone release assets were not published correctly.' }
