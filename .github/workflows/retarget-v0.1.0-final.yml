name: Retarget v0.1.0 final source

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/retarget-v0.1.0-final.yml'

permissions:
  contents: write
  statuses: write

jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - name: Point v0.1.0 at final portable release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 48b33e611cc791a83adbb8a32d8dec59dbb87f59
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/v0.1.0" \
            -f sha="$TARGET_SHA" -F force=true >/dev/null
          actual="$(gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.0" --jq '.object.sha')"
          test "$actual" = "$TARGET_SHA"
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='v0.1.0-final-tag' \
            -f description='v0.1.0 tag matches final portable release source' >/dev/null
