name: Update repository About metadata

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-repository-about.yml'

permissions:
  contents: write
  statuses: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update description and topics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          state=success
          description='Repository About metadata updated'

          gh api -X PATCH "repos/${{ github.repository }}" \
            -f description='Consent-first Windows remote-support controller with audited RDP, SSH/SFTP and VNC hand-offs for Windows, macOS and Linux.' >/dev/null || state=failure

          if [ "$state" = success ]; then
            gh api -X PUT "repos/${{ github.repository }}/topics" --input - <<'JSON' >/dev/null || state=failure
          {
            "names": [
              "windows",
              "remote-support",
              "remote-desktop",
              "remote-access",
              "rdp",
              "ssh",
              "sftp",
              "vnc",
              "macos",
              "linux",
              "ubuntu",
              "cpp",
              "cpp20",
              "win32",
              "x86",
              "x64",
              "security",
              "audit-logging",
              "consent"
            ]
          }
          JSON
          fi

          if [ "$state" = failure ]; then
            description='Repository token cannot update About metadata'
          fi

          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context='repository-about-update' \
            -f description="$description" >/dev/null

          test "$state" = success
