name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse modern C++
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Configure modern native x86 target
        run: cmake -S modern -B build-modern-codeql-x86 -A Win32

      - name: Build modern native x86 target
        run: cmake --build build-modern-codeql-x86 --config Debug --parallel

      - name: Configure modern native x64 target
        run: cmake -S modern -B build-modern-codeql-x64 -A x64

      - name: Build modern native x64 target
        run: cmake --build build-modern-codeql-x64 --config Debug --parallel

      - name: Analyse
        uses: github/codeql-action/analyze@v4
