name: Remove previous preview releases

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup-old-releases.yml'

permissions:
  contents: write
  statuses: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove old releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for tag in v0.1.0 v0.2.0; do
            gh release delete "$tag" --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" >/dev/null 2>&1 || true
          done

          failed=0
          for tag in v0.1.0 v0.2.0; do
            if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
              failed=1
            fi
          done

          if [ "$failed" -eq 0 ]; then
            state=success
            description='Previous preview releases and tags removed'
          else
            state=failure
            description='One or more old release tags remain'
          fi

          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context='release-history-cleanup' \
            -f description="$description" >/dev/null

          test "$failed" -eq 0
