name: Replace macOS v0.1.0 assets

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/replace-macos-assets-v0.1.0.yml'

permissions:
  contents: write
  statuses: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            suffix: AppleSilicon
          - runner: macos-15-intel
            suffix: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build macOS package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pyinstaller
          python portable/remote_support.py --self-test
          python -m PyInstaller --clean --noconfirm --windowed --name 'Windows Remote Support' portable/remote_support.py
          mkdir -p dmg-root
          cp -R 'dist/Windows Remote Support.app' dmg-root/
          hdiutil create -volname 'Windows Remote Support' -srcfolder dmg-root -ov -format UDZO "Windows-Remote-Support-macOS-${{ matrix.suffix }}.dmg"
      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.suffix }}
          path: Windows-Remote-Support-macOS-${{ matrix.suffix }}.dmg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: macos-*
          merge-multiple: true
          path: dist
      - name: Replace macOS assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete-asset v0.1.0 Windows-Remote-Support-macOS.dmg -y --repo "${{ github.repository }}" 2>/dev/null || true
          gh release upload v0.1.0 \
            dist/Windows-Remote-Support-macOS-AppleSilicon.dmg \
            dist/Windows-Remote-Support-macOS-Intel.dmg \
            --clobber \
            --repo "${{ github.repository }}"
          assets="$(gh release view v0.1.0 --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          grep -Fxq 'Windows-Remote-Support-macOS-AppleSilicon.dmg' <<< "$assets"
          grep -Fxq 'Windows-Remote-Support-macOS-Intel.dmg' <<< "$assets"
          if grep -Fxq 'Windows-Remote-Support-macOS.dmg' <<< "$assets"; then exit 1; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='macos-v0.1.0-assets' \
            -f description='Apple Silicon and Intel DMGs published to v0.1.0' >/dev/null
