name: One-time repository identity refresh

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-time-repository-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Clean branches, metadata and repository identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_REPO: ${{ github.repository }}
          NEW_REPO: reginalluna/Remote-Support-Bridge
        run: |
          set -euo pipefail

          while IFS= read -r branch; do
            if [ "$branch" != master ]; then
              gh api -X DELETE "repos/$OLD_REPO/git/refs/heads/$branch" >/dev/null || true
            fi
          done < <(gh api --paginate "repos/$OLD_REPO/branches" --jq '.[].name')

          gh release edit v0.1.0 \
            --repo "$OLD_REPO" \
            --title 'Remote Support Bridge v0.1.0'

          gh api -X PUT "repos/$OLD_REPO/topics" --input - <<'JSON' >/dev/null
          {
            "names": [
              "remote-support",
              "remote-access",
              "remote-desktop",
              "cross-platform",
              "windows",
              "macos",
              "linux",
              "ubuntu",
              "rdp",
              "ssh",
              "sftp",
              "vnc",
              "consent",
              "audit-logging",
              "cpp",
              "python"
            ]
          }
          JSON

          gh api -X PATCH "repos/$OLD_REPO" \
            -f name='Remote-Support-Bridge' \
            -f description='Consent-first cross-platform remote-support controller with audited RDP, SSH/SFTP and VNC hand-offs for Windows, macOS and Linux.' \
            -F delete_branch_on_merge=true >/dev/null

          workflow_path='.github/workflows/one-time-repository-refresh.yml'
          workflow_sha="$(gh api "repos/$NEW_REPO/contents/$workflow_path?ref=master" --jq '.sha')"
          gh api -X DELETE "repos/$NEW_REPO/contents/$workflow_path" \
            -f message='Remove one-time repository refresh workflow' \
            -f sha="$workflow_sha" \
            -f branch=master >/dev/null

          final_sha="$(gh api "repos/$NEW_REPO/git/ref/heads/master" --jq '.object.sha')"
          gh api -X PATCH "repos/$NEW_REPO/git/refs/tags/v0.1.0" \
            -f sha="$final_sha" \
            -F force=true >/dev/null
