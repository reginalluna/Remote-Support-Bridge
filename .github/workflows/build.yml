name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.configuration }} Win32
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable vcpkg MSBuild integration
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw 'vcpkg is not available on this runner' }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      - name: Build
        shell: pwsh
        run: msbuild server/2015Remote.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=Win32
